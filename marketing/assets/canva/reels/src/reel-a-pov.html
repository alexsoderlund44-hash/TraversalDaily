<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
.veh{z-index:3;position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:var(--card);border:6px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:grid;place-items:center;font-size:58px}
.lbl{position:absolute;white-space:nowrap;font-family:'Alegreya';font-weight:700;font-size:40px;color:var(--ink);text-shadow:0 0 8px #F7EEDB,0 0 8px #F7EEDB,0 0 14px #F7EEDB}
.dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--ink);border:6px solid var(--card)}
.dot.start{background:var(--teal)} .dot.end{background:var(--red)}
.ring{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:7px solid var(--teal);background:rgba(38,105,109,.18)}
/* HUD: decisions as pips, km still to go, the day's rule */
.hud .pips{display:flex;gap:7px;align-items:center;height:62px}
.hud .pips i{display:block;width:26px;height:44px;border-radius:7px;background:var(--teal);border:4px solid var(--ink)}
.hud .pips i.off{background:transparent;border-color:rgba(43,31,20,.3)}
/* the choice dock, like the game's cards under the chart */
#dock{position:absolute;left:70px;width:850px;top:1170px;display:flex;gap:22px}
.ch{flex:1;min-width:0;background:var(--card);border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:20px;padding:16px 16px 18px;position:relative}
.ch .c{font-family:'Alegreya';font-weight:700;font-size:40px;white-space:nowrap;line-height:1.1}
.ch .p{font-family:'Alfa Slab One';font-size:50px;color:var(--red);white-space:nowrap;margin-top:6px}
.ch .p .deal{font-family:'Alegreya Sans';font-size:22px;font-weight:900;background:var(--brass);color:var(--card);border-radius:8px;padding:2px 9px;margin-left:8px;letter-spacing:2px;vertical-align:8px}
.ch .g{font-weight:900;font-size:28px;letter-spacing:0;white-space:nowrap;margin-top:6px}
.ch .g.up{color:var(--teal)} .ch .g.dn{color:var(--red)}
.ch.pick{border-color:var(--teal);box-shadow:8px 8px 0 var(--teal)}
.ch .tick{position:absolute;right:-16px;top:-20px;width:58px;height:58px;border-radius:50%;background:var(--teal);color:var(--card);border:5px solid var(--ink);display:grid;place-items:center;font-size:34px;font-weight:900}
#stamp{position:absolute;left:140px;width:720px;top:1170px;text-align:center;border:12px solid var(--red);color:var(--red);border-radius:26px;padding:22px 10px 26px;background:rgba(247,238,219,.94);font-family:'Alfa Slab One';font-size:84px;line-height:1;letter-spacing:2px}
#stamp small{display:block;font-family:'Alegreya Sans';font-weight:900;font-size:42px;letter-spacing:4px;margin-top:12px}
#end{position:absolute;inset:0}
.follow{position:absolute;left:70px;top:1180px}
.url{position:absolute;left:74px;top:1320px;font-family:'Alegreya';font-style:italic;font-weight:700;font-size:50px;color:var(--ink)}
</style></head><body>
<div class="stage">
  <svg class="chart" id="chart" viewBox="0 0 1080 1920"></svg>
  <div class="grain"></div><div class="vig"></div>
  <div id="fx"></div>
  <div class="hud" id="hud">
    <div class="box" style="flex:1.45"><div class="k" id="decK">7 decisions left</div><div class="pips" id="pips"></div></div>
    <div class="box"><div class="k">To go</div><div class="v" id="km">3,874 km</div></div>
    <div class="box" style="flex:.55"><div class="k">Rule</div><div class="v" style="font-size:46px">🚫✈️</div></div>
  </div>
  <div id="dock"></div>
  <div class="cap" id="hook" style="top:300px;font-size:88px" data-words="POV: you get *7 *decisions to reach San Francisco"></div>
  <div id="hook2" style="position:absolute;left:70px;top:830px"><span class="pill" style="font-size:46px">Cancún → SF · no flights</span></div>
  <div id="stamp">YOU MADE IT<small>6 OF 7 DECISIONS · $346</small></div>
  <div id="end">
    <div class="cap" id="endcap" style="top:250px;font-size:92px" data-words="Could *you make it in 7?"></div>
    <div class="follow" id="endpill"><span class="pill" style="font-size:44px">Follow for tomorrow's route</span></div>
    <div class="url" id="endurl">traversledaily.com</div>
  </div>
</div>
<script src="d3.min.js"></script><script src="topojson-client.min.js"></script><script src="world-lite.js"></script><script src="lib.js"></script>
<script>
window.DUR = 18.5;
/* puzzle #8 as the game plays it (choicesFrom in js/traverse-ui.js, run against the engine):
   at each stop the 1-3 places it lights up, with the leg it offers, and how much closer each gets you */
const STEPS = [
  { at: 'can', opts: [['mia', '🚢', 93, -296], ['hav', '🚢', 60, -258]], note: 'Both ways go *backwards 😳' },
  { at: 'mia', opts: [['atl', '🚌', 37, 733, 1]], note: 'Secret fare *−35% 🎟️' },
  { at: 'atl', opts: [['dal', '🚌', 48, 1054], ['chi', '🚌', 42, 452], ['tor', '🚌', 50, -208]], note: "Cheapest isn't *closest 👀" },
  { at: 'dal', opts: [['den', '🚌', 54, 858], ['chi', '🚆', 106, -602]] },
  { at: 'den', opts: [['lax', '🚆', 78, 966, 1]], note: 'Another *secret *fare 🎟️' },
  { at: 'lax', opts: [['sfo', '🚘', 36, 559]] },
];
const KM = { can: 3874, mia: 4170, atl: 3437, dal: 2383, den: 1525, lax: 559, sfo: 0 };
const DEC = 7, ROUTE = ['can', 'mia', 'atl', 'dal', 'den', 'lax', 'sfo'];
const chart = makeChart($('#chart'), [[-125, 14], [-74, 50]]);
const fx = $('#fx'), xyOf = id => chart.proj(CITY[id].ll);
const hookW = buildCaption($('#hook')), endW = buildCaption($('#endcap'));
const el = (cls, html, parent = fx) => { const d = document.createElement('div'); d.className = cls; if (html !== undefined) d.innerHTML = html; parent.appendChild(d); return d; };
const pips = Array.from({ length: DEC }, () => $('#pips').appendChild(document.createElement('i')));

// timeline: steps with a real choice get time to look; single-option steps move on quickly
const S0 = 3.4, TRAV = .85;
let s = S0;
STEPS.forEach((st, i) => {
  const multi = st.opts.length > 1;
  st.s = s; st.c = s + (multi ? .9 : .4); st.tr = st.c + .25; st.e = st.tr + TRAV; s = st.e;
  st.to = st.opts[0][0];
  st.cards = st.opts.map(([id, em, cost, gain, deal]) => ({ id, el: null, html: `<div class="c">${em} ${CITY[id].n}</div><div class="p">$${cost}${deal ? '<span class="deal">DEAL</span>' : ''}</div><div class="g ${gain >= 0 ? 'up' : 'dn'}">${gain >= 0 ? '▲ ' + gain.toLocaleString() + ' km closer' : '▼ ' + (-gain) + ' km further'}</div>` }));
  st.path = legPath(chart, CITY[st.at].ll, CITY[st.to].ll, i % 2 ? .12 : -.12, { stroke: '#8E2A1E', 'stroke-width': 5, 'stroke-linecap': 'round' });
  st.spokes = st.opts.map(([id]) => legPath(chart, CITY[st.at].ll, CITY[id].ll, 0, { stroke: '#26696D', 'stroke-width': 3, 'stroke-dasharray': '8 8', opacity: 0 }));
  st.veh = el('veh', st.opts[0][1]);
  st.rings = st.opts.map(() => el('ring'));
  if (st.note) { st.noteEl = document.createElement('div'); st.noteEl.className = 'cap'; st.noteEl.style.cssText = 'top:385px;font-size:58px'; st.noteEl.dataset.words = st.note; $('.stage').insertBefore(st.noteEl, $('#dock')); st.noteW = buildCaption(st.noteEl); }
});
const LEGS_END = s;
const dots = {}, lbls = {};
[...new Set([...ROUTE, ...STEPS.flatMap(st => st.opts.map(o => o[0]))])].forEach(id => {
  dots[id] = el('dot' + (id === 'can' ? ' start' : id === 'sfo' ? ' end' : ''));
  lbls[id] = el('lbl', CITY[id].n);
});
const BELOW = { can: 1, mia: 1, hav: 1, dal: 1, lax: 1 };

// camera frames: each decision is framed on where you are plus every place on offer
function frame(ids, maxK = 2.3) {
  const P = ids.map(xyOf), x0 = Math.min(...P.map(p => p[0])), x1 = Math.max(...P.map(p => p[0])), y0 = Math.min(...P.map(p => p[1])), y1 = Math.max(...P.map(p => p[1]));
  return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, k: Math.min(maxK, 600 / Math.max(1, x1 - x0), 380 / Math.max(1, y1 - y0)) };
}
const F = STEPS.map(st => frame([st.at, ...st.opts.map(o => o[0])]));
const F_END = frame(ROUTE, 9); F_END.k = 560 / (Math.max(...ROUTE.map(id => xyOf(id)[0])) - Math.min(...ROUTE.map(id => xyOf(id)[0])));
const F0 = frame(ROUTE, 9); F0.k *= .82;
const mixF = (a, b, f) => ({ x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f), k: Math.exp(lerp(Math.log(a.k), Math.log(b.k), f)) });

window.render = function (t) {
  // ---- camera
  let cam, sx = 500, sy = 800;
  if (t < 2.9) cam = mixF(F0, Object.assign({}, F0, { k: F0.k * 1.12 }), E.inOut(P(t, 0, 2.9)));
  else if (t < S0) cam = mixF(Object.assign({}, F0, { k: F0.k * 1.12 }), F[0], E.inOut(P(t, 2.9, S0 - 2.9)));
  else if (t < LEGS_END) {
    const i = STEPS.findIndex(st => t < st.e), st = STEPS[i], nx = F[i + 1] || frame(['lax', 'sfo']);
    cam = mixF(F[i], nx, E.inOut(P(t, st.tr, TRAV)));
  } else {
    const f = E.inOut(P(t, LEGS_END, .9));
    cam = mixF(frame(['lax', 'sfo']), F_END, f); sy = lerp(800, 840, f);
  }
  camXY(chart, cam.x, cam.y, cam.k, sx, sy);

  // ---- hook, readable on frame 0
  revealWords(hookW, t + .7, 0, .075);
  const hookOut = E.in(P(t, 2.55, .4));
  css($('#hook'), { opacity: 1 - hookOut, transform: `translateX(${-hookOut * 300}px)` });
  const h2 = E.spring(P(t, .5, .5));
  css($('#hook2'), { opacity: (P(t, .5, .05) > 0 ? 1 : 0) * (1 - hookOut), transform: `translateX(${-hookOut * 300}px) scale(${lerp(.6, 1, h2)}) rotate(${lerp(-6, -2, h2)}deg)`, transformOrigin: '0 50%' });

  // ---- HUD: a pip burns as each leg starts
  const hud = E.spring(P(t, 2.75, .6)), hudOut = E.in(P(t, LEGS_END + .3, .35));
  css($('#hud'), { opacity: P(t, 2.75, .1) * (1 - hudOut), transform: `translateY(${(1 - hud) * -300 - hudOut * 300}px)` });
  const used = STEPS.filter(st => t >= st.tr + .15).length;
  pips.forEach((p, j) => {
    const st = STEPS[DEC - 1 - j]; const burn = st ? P(t, st.tr + .15, .3) : 0;
    p.className = j >= DEC - used ? 'off' : '';
    p.style.transform = burn > 0 && burn < 1 ? `scale(${1 + Math.sin(burn * Math.PI) * .45})` : 'none';
    p.style.background = burn > 0 && burn < 1 ? 'var(--red)' : '';
  });
  $('#decK').textContent = `${DEC - used} decision${DEC - used === 1 ? '' : 's'} left`;
  let km = KM.can;
  STEPS.forEach(st => { const f = E.inOut(P(t, st.tr, TRAV)); if (f > 0) km = lerp(KM[st.at], KM[st.to], f); });
  $('#km').textContent = Math.round(km).toLocaleString() + ' km';

  // ---- each decision: places light up, cards dock, one is picked, the leg draws
  const curStep = STEPS.findIndex(st => t >= st.s - .05 && t < st.e);
  STEPS.forEach((st, i) => {
    const active = i === curStep && t < LEGS_END, choose = t >= st.s && t < st.tr + .25;
    const lit = E.spring(P(t, st.s, .45)) * (1 - E.in(P(t, st.tr, .3)));
    st.opts.forEach(([id], k) => {
      const [x, y] = scr(chart, xyOf(id)), picked = k === 0 && t >= st.c;
      const pulse = 1 + Math.sin((t - st.s) * 9 + k) * .1;
      css(st.rings[k], { display: active && lit > .01 ? 'block' : 'none', left: x + 'px', top: y + 'px', opacity: picked ? 1 : t >= st.c ? lerp(1, .25, P(t, st.c, .2)) : 1, transform: `scale(${lit * pulse * (picked ? 1.25 : 1)})`, borderColor: picked ? 'var(--red)' : 'var(--teal)' });
      st.spokes[k].setAttribute('opacity', active ? .9 * lit * (t >= st.c && !picked ? .3 : 1) : 0);
    });
    // the dock
    if (i === curStep && choose && !st.built) { $('#dock').innerHTML = ''; st.cards.forEach(c => { c.el = el('ch', c.html, $('#dock')); }); st.built = true; STEPS.forEach((o, j) => { if (j !== i) o.built = false; }); }
    if (i === curStep && st.built) {
      const n = st.cards.length;
      $('#dock').style.width = n === 1 ? '440px' : '850px';
      st.cards.forEach((c, k) => {
        const inn = E.spring(P(t, st.s + k * .07, .45)), out = E.in(P(t, st.tr - .05, .3)), picked = k === 0 && t >= st.c;
        c.el.classList.toggle('pick', picked);
        if (picked && !c.el.querySelector('.tick')) c.el.insertAdjacentHTML('beforeend', '<div class="tick">✓</div>');
        if (!picked) { const tk = c.el.querySelector('.tick'); if (tk) tk.remove(); }
        const press = picked ? 1 + Math.sin(P(t, st.c, .25) * Math.PI) * .06 : 1;
        css(c.el, { opacity: (t >= st.c && !picked ? lerp(1, .35, P(t, st.c, .15)) : 1) * (1 - out), transform: `translateY(${(1 - inn) * 260 + out * 260}px) scale(${press})` });
      });
    }
    // note caption for this decision
    if (st.noteEl) { revealWords(st.noteW, t, st.s + .1, .07); css(st.noteEl, { display: i === curStep && t < st.tr + .35 ? 'block' : 'none', opacity: 1 - E.in(P(t, st.tr + .05, .25)) }); }
    // the leg
    const f = E.inOut(P(t, st.tr, TRAV));
    drawPath(st.path, f);
    const on = t >= st.tr - .05 && t < st.e + .15;
    const [vx, vy] = scr(chart, pointOn(st.path, f));
    css(st.veh, { display: on ? 'grid' : 'none', left: vx + 'px', top: vy + 'px', transform: `scale(${E.spring(P(t, st.tr - .05, .3)) * (1 - E.in(P(t, st.e, .15)))})` });
  });
  if (curStep < 0) $('#dock').innerHTML = '';

  // ---- dots and labels: where you are, what's on offer, and the whole route at the end
  const outro = t >= LEGS_END;
  Object.keys(dots).forEach(id => {
    const [x, y] = scr(chart, xyOf(id));
    const ri = ROUTE.indexOf(id), reached = ri === 0 ? t >= 2.9 : ri > 0 && t >= STEPS[ri - 1].e - .05;
    const offered = curStep >= 0 && STEPS[curStep].opts.some(o => o[0] === id) && t >= STEPS[curStep].s && t < STEPS[curStep].tr + .3;
    const here = curStep >= 0 ? STEPS[curStep].at === id : (t >= 2.9 && t < S0 && id === 'can');
    const showDot = reached || offered || id === 'sfo' && t >= 2.9;
    css(dots[id], { left: x + 'px', top: y + 'px', transform: `scale(${showDot ? 1 : 0})` });
    const showLbl = outro ? ri >= 0 : (here || offered || (id === 'sfo' && t >= 2.9 && t < S0 + .1));
    const off = id === 'sfo' && !outro && !offered ? -1 : 1; // destination label hangs above
    css(lbls[id], { left: x + 'px', top: y + 'px', opacity: showLbl ? 1 : 0, transform: `translate(-50%,${BELOW[id] && off > 0 ? (outro ? 30 : 60) : (outro ? -135 : -175)}%)` });
  });

  // ---- stamp under the finished route, then the end card
  const sT = LEGS_END + .55, stp = P(t, sT, .45), sOut = E.in(P(t, sT + 1.35, .3));
  const shake = stp > 0 && stp < 1 ? Math.sin(t * 90) * 10 * (1 - stp) : 0;
  css($('#stamp'), { opacity: stp > 0 ? 1 - sOut : 0, transform: `translate(${shake}px,${sOut * 160}px) rotate(-4deg) scale(${lerp(2.0, 1, E.out5(stp))})` });
  const E0 = sT + 1.45;
  css($('#end'), { opacity: t > E0 ? 1 : 0 });
  revealWords(endW, t, E0 + .05, .12);
  const ep = E.spring(P(t, E0 + .6, .5));
  css($('#endpill'), { opacity: P(t, E0 + .6, .05), transform: `scale(${lerp(.6, 1, ep)}) rotate(-2deg)`, transformOrigin: '0 50%' });
  css($('#endurl'), { opacity: P(t, E0 + 1, .3) });
};
window.render(0);
</script></body></html>
