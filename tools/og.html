<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Alegreya+Sans:ital,wght@0,400;0,800&display=swap" rel="stylesheet"><style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#E8D9B5;font-family:"Alfa Slab One","Rockwell",serif;color:#2B1D12}
  svg{position:absolute;inset:0}
  body:after{content:"";position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 50%,transparent 60%,rgba(60,40,20,.35))}
  .t{position:absolute;left:72px;top:150px;width:800px;z-index:1}
  .k{font:800 20px "Alegreya Sans",system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9A6B1F;margin:0 0 18px}
  h1{font-weight:400;font-size:112px;line-height:.95;margin:0;letter-spacing:.01em;text-shadow:4px 4px 0 #FAF3E1,7px 7px 0 rgba(43,29,18,.18)}
  h1 b{display:inline-block;vertical-align:top;margin:6px 0 0 14px;text-transform:uppercase;font:800 26px "Alegreya Sans",system-ui,sans-serif;letter-spacing:.22em;color:#A13A2A;border:4px solid #A13A2A;border-radius:6px;padding:8px 12px 6px;transform:rotate(8deg);text-shadow:none}
  p{font:italic 500 32px/1.35 "Alegreya",Georgia,serif;color:#5A4531;margin:26px 0 0}
  .modes{position:absolute;left:72px;bottom:64px;font-size:38px;letter-spacing:.3em}
</style></head><body>
<svg id="m" width="1200" height="630"></svg>
<div class="t"><p class="k">A new puzzle every day</p><h1>Traversle<b>Daily</b></h1><p>Plan the smartest route across the world on a budget.</p></div>
<div class="modes">✈️ 🚆 🚌 🚢 🚘</div>
<script src="../vendor/d3.min.js"></script><script src="../vendor/topojson-client.min.js"></script><script src="../data/world.js"></script>
<script>
  const svg = d3.select('#m'), proj = d3.geoNaturalEarth1().scale(1250).center([6, 46]).translate([900, 330]), path = d3.geoPath(proj);
  const land = topojson.feature(WORLD_TOPO, WORLD_TOPO.objects.countries);
  svg.append('path').attr('d', path({ type: 'Sphere' })).attr('fill', '#CBD3C3');
  svg.append('path').attr('d', path(d3.geoGraticule().step([5, 5])())).attr('fill', 'none').attr('stroke', 'rgba(43,29,18,.14)');
  const all = topojson.merge(WORLD_TOPO, WORLD_TOPO.objects.countries.geometries);
  [[22, .05], [12, .09], [5, .16]].forEach(([w, a]) => svg.append('path').attr('d', path(all)).attr('fill', 'none').attr('stroke', 'rgba(43,29,18,' + a + ')').attr('stroke-width', w).attr('stroke-linejoin', 'round'));
  svg.append('g').selectAll('path').data(land.features).join('path').attr('d', path).attr('fill', '#EBDCB4').attr('stroke', 'rgba(43,29,18,.6)').attr('stroke-width', .8);
  const stops = [[-9.14, 38.72], [2.17, 41.39], [9.19, 45.46], [16.37, 48.21], [21.01, 52.23]]; // Lisbon, Barcelona, Milan, Vienna, Warsaw
  const cols = ['#A13A2A', '#2F7F84', '#9A6B1F', '#2F7F84'];
  for (let i = 0; i < stops.length - 1; i++) svg.append('path').attr('d', path({ type: 'LineString', coordinates: [stops[i], stops[i + 1]] })).attr('fill', 'none').attr('stroke', cols[i]).attr('stroke-width', 4).attr('stroke-linecap', 'round');
  stops.forEach((s, i) => { const [x, y] = proj(s); svg.append('circle').attr('cx', x).attr('cy', y).attr('r', i === 0 || i === stops.length - 1 ? 9 : 6).attr('fill', i === 0 ? '#2F7F84' : i === stops.length - 1 ? '#A13A2A' : '#9A6B1F').attr('stroke', '#FAF3E1').attr('stroke-width', 3); });
  document.body.dataset.ready = '1';
</script></body></html>
